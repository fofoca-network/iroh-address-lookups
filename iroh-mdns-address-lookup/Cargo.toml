[package]
name = "iroh-mdns-address-lookup"
version = "0.4.0"
edition = "2024"
readme = "README.md"
description = "mDNS-based address lookup for iroh"
license = "MIT OR Apache-2.0"
authors = ["n0 team"]
repository = "https://github.com/n0-computer/iroh-address-lookups"
homepage = "https://github.com/n0-computer/iroh-address-lookups"
documentation = "https://docs.rs/iroh-mdns-address-lookup"
keywords = ["iroh", "mdns", "swarm-discovery", "address-lookup"]
categories = ["network-programming"]

# Sadly this also needs to be updated in .github/workflows/ci.yml
rust-version = "1.91"

[lints]
workspace = true

[dependencies]
data-encoding = "2.10"
derive_more = { version = "2.1", features = ["debug"] }
futures-util = "0.3"
# FORK: fofoca-network/iroh, not crates.io. See the repo README -- this fork
# exists only to repoint these two lines, and carries no functional change.
#
# This crate sits between fofoca and iroh, and it named iroh from crates.io
# while fofoca names a fork. Two irohs in one graph, and the AddressLookup impl
# below stops satisfying the trait the forked Endpoint hands back (E0308). The
# only other way to reconcile that is a [patch.crates-io] in every consumer's
# workspace root, restated by hand and silently wrong when one drifts.
iroh = { version = "=1.0.3", git = "https://github.com/fofoca-network/iroh", rev = "b7e07872a6d28a9b7971ecfaca8db69c4bddd2de", default-features = false }
iroh-base = { version = "=1.0.3", git = "https://github.com/fofoca-network/iroh", rev = "b7e07872a6d28a9b7971ecfaca8db69c4bddd2de", default-features = false, features = ["key"] }
n0-error = "1.0.0"
n0-future = "0.3.2"
n0-watcher = "1"
# PIN: rkuhn/swarm-discovery at a git rev, not crates.io. 0.6.3 spins a 10 ms
# retry loop in updater.rs gc() once the mDNS updater actor is gone
# (rkuhn/swarm-discovery#28). Fixed in PR #27 on 2026-07-13, unreleased.
# Return to a crates.io version at 0.6.4+.
swarm-discovery = { version = "=0.6.3", git = "https://github.com/rkuhn/swarm-discovery", rev = "b41dbcc431f419ad0cd91f786d4d7c71ec6be9ce" }
tokio = { version = "1.49", features = ["rt", "sync"] }
tokio-stream = { version = "0.1.15", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
iroh = { version = "=1.0.3", git = "https://github.com/fofoca-network/iroh", rev = "b7e07872a6d28a9b7971ecfaca8db69c4bddd2de" }
n0-tracing-test = "0.3"
rand = "0.10"
rand_chacha = "0.10"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "iroh_docsrs"]
